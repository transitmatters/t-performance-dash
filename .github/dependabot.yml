version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Skip patch bumps (security updates ignore this rule)
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Skip patch bumps (security updates ignore this rule)
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Skip patch bumps (security updates ignore this rule)
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
