name: test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-tags: true
      - name: Set up Node/Python via mise
        uses: jdx/mise-action@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
      - name: Install dependencies
        run: cd server && uv sync --group dev
      - name: Run backend tests
        run: cd server && uv run pytest tests/ -v
  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['26']
        python-version: ['3.14']
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # npm ci's postinstall runs `uv sync` for the backend
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
      - name: Set up Node ${{ matrix.node-version }}.x
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run frontend tests
        run: |
          npm ci
          npm test
