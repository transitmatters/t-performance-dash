[project]
name = "t-performance-dash"
version = "4.0.0"
description = "TransitMatters performance visualizer for the MBTA"
authors = [{ name = "TransitMatters Labs Team" }]
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = [
    "json-api-doc==0.15.0",
    "requests~=2.34.2",
    "pytz~=2026.4",
    "boto3~=1.43.0",
    # numpy, pandas and pillow ship only manylinux_2_28 wheels now; Chalice 1.33+ is needed to fetch them.
    "numpy~=2.5.3",
    "pandas~=2.3.3",
    "datadog_lambda~=8.128.0",
    "dynamodb-json~=1.4.2",
    "chalice-spec~=0.7.0",
    "pydantic~=2.13.5",
    "apispec~=6.10.0",
    # Draws the social cards.
    "pillow~=12.3.0",
]

[dependency-groups]
dev = [
    "chalice==1.33.0",
    # botocore needs crt for the `aws login` credential provider during local dev.
    "boto3[crt]",
    "ruff>=0.16.9",
    "pytest~=9.1.1",
    "pre-commit>=4.6.2",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pyright]
reportMissingImports = true
reportMissingTypeStubs = false
useLibraryCodeForTypes = false
