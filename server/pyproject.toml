[project]
name = "t-performance-dash"
version = "5.0.0"
description = "TransitMatters performance visualizer for the MBTA"
authors = [{ name = "TransitMatters Labs Team" }]
requires-python = ">=3.14,<3.15"
license = "MIT"
dependencies = [
    "json-api-doc==0.15.0",
    "requests~=2.34.2",
    "pytz~=2026.5",
    "boto3~=1.43.117",
    "numpy~=2.5.4",
    "pandas~=3.0.6",
    "datadog_lambda~=8.130.0",
    "dynamodb-json~=1.4.2",
    "chalice-spec~=0.7.0",
    "pydantic~=2.14.1",
    "apispec~=6.10.0",
    "pillow~=13.0.0",
]

[dependency-groups]
dev = [
    "chalice==1.34.0",
    "boto3[crt]",
    "ruff>=0.17.1",
    "pytest~=9.1.1",
    "pre-commit>=4.7.0",
    "openapi-schema-validator~=0.9.0",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pyright]
reportMissingImports = true
reportMissingTypeStubs = false
useLibraryCodeForTypes = false
